<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code Generator | Every-Tool</title>
  <meta name="description" content="Voer een URL in en genereer direct een professionele QR-code om te downloaden of te gebruiken."/>
  <link rel="canonical" href="https://every-tool.netlify.app/qr/"/>
  <link rel="stylesheet" href="../style.css">
  <script>
    // Direct bij het laden van de pagina de juiste opgeslagen taal toepassen om 'terugspringen' te voorkomen
    (function() {
      const savedLang = localStorage.getItem('everyToolLang') || localStorage.getItem('gekozenTaal') || 'nl';
      document.documentElement.lang = savedLang;
    })();
  </script>
</head>
<body data-theme="light">

  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu">☰ Menu</button>
      <a href="../" class="app-title" style="text-decoration:none; color:inherit;">Every-Tool</a>
    </div>
    
    <div class="topbar-right">
      <button class="top-action-btn" onclick="toggleDarkMode()" id="darkModeBtn">🌙 Dark Mode</button>
      <button class="top-action-btn" onclick="shareSite()" id="shareBtn">🔗 Deel</button>
    </div>
  </header>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <nav class="nav-sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Kies een Tool</h2>
      <button class="close-btn" onclick="toggleSidebar()" aria-label="Sluit menu">✕</button>
    </div>
    <div class="tool-group"><a href="../" class="tool-btn" style="text-decoration:none; color:inherit;">🏠 Overzicht / Home</a></div>
    <div class="tool-group"><a href="../timer/" class="tool-btn" style="text-decoration:none; color:inherit;">⏱️ Speech & Presentatie</a></div>
    <div class="tool-group"><a href="../checker/" class="tool-btn" style="text-decoration:none; color:inherit;">✍️ Grammatica Bot</a></div>
    <div class="tool-group"><a href="../ai/" class="tool-btn" style="text-decoration:none; color:inherit;">🤖 AI-Tekst Detector</a></div>
    <div class="tool-group"><a href="../tts/" class="tool-btn" style="text-decoration:none; color:inherit;">🔊 Tekst-naar-Spraak</a></div>
    <div class="tool-group"><a href="../translate/" class="tool-btn" style="text-decoration:none; color:inherit;">🌍 Vertaal Tool</a></div>
    <div class="tool-group"><a href="./" class="tool-btn" style="text-decoration:none; color:inherit;">📱 QR Code Generator</a></div>
    <div class="tool-group"><a href="../converter/" class="tool-btn" style="text-decoration:none; color:inherit;">🔄 Universele Converter</a></div>
    <div class="tool-group"><a href="../blog/" class="tool-btn" style="text-decoration:none; color:inherit;">📰 Blog</a></div>
  </nav>

  <main class="container">
    <div class="section-header-wrapper">
      <h2 class="section-title">QR Code Generator</h2>
      <p class="section-subtitle">Voer een URL in om direct een QR-code te genereren.</p>
    </div>
    <div class="url-input-group">
      <input type="url" id="qrUrlInput" placeholder="https://jouwwebsite.nl" oninput="generateQRFromInput()" />
      <button class="btn clear-btn" onclick="clearTextArea('qrUrlInput')" style="padding: 10px 14px;">🗑 Wis</button>
      <button class="btn" onclick="generateQRFromInput()">Genereer</button>
    </div>
    <div class="qr-preview-box" id="qrPreviewBox">
      <p style="color: var(--text-muted); font-size: 14px; margin: 0;">Vul een URL in...</p>
    </div>
  </main>

  <script src="../script.js"></script>
</body>
</html>
