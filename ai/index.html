<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI-Tekst Detector & Indicator | Every-Tool</title>
  <meta name="description" content="Analyseer zinsstructuur op AI-kenmerken en controleer de geschatte AI-waarschijnlijkheid van je tekst."/>
  <link rel="canonical" href="https://every-tool.netlify.app/ai/"/>
  <link rel="stylesheet" href="../style.css">
</head>
<body data-theme="light">
  <header class="topbar">
    <div class="topbar-left">
      <a href="../" class="app-title" style="text-decoration:none; color:inherit;">Every-Tool</a>
    </div>
    <div class="topbar-right">
      <button class="top-action-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </div>
  </header>

  <main class="container">
    <div class="section-header-wrapper">
      <h2 class="section-title">AI-Tekst Detector Indicator</h2>
      <p class="section-subtitle">Analyseer zinsstructuur op AI-kenmerken.</p>
    </div>
    <textarea id="text-ai" placeholder="Plak hier je tekst..." oninput="checkAI()"></textarea>
    <div class="stats-bar">
      <span id="stats-ai-text">Woorden: 0 | Tekens: 0</span>
      <button class="btn clear-btn" onclick="clearTextArea('text-ai')">🗑️ Wis tekst</button>
    </div>

    <div class="card" style="text-align: left;">
      <h4 style="margin-bottom: 8px;">Geschatte AI-waarschijnlijkheid</h4>
      <div class="val" id="aiScore" style="margin-bottom: 12px;">0%</div>
      <div class="ai-bar-bg"><div class="ai-bar-fill" id="aiBar"></div></div>
      <p style="font-size:14px; color: var(--text-muted); margin-bottom: 0; font-weight: 500;">Voer minimaal 50 tekens in.</p>
    </div>
  </main>

  <script src="../script.js"></script>
</body>
</html>
