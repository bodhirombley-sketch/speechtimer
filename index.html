<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every-Tool - Handige online tools</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        .share-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .share-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Welkom bij Every-Tool</h1>
    <p>Hier vind je straks allerlei handige tools op één plek!</p>

    <!-- De kopieerknop -->
    <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href); alert('Link gekopieerd!');">Deel deze site</button>

</body>
</html>
