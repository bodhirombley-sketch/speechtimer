<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Free Online Text & Case Converter</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f8fafc; color: #1e293b; }
    h1 { text-align: center; color: #0f172a; margin-bottom: 8px; }
    p.subtitle { text-align: center; color: #64748b; margin-top: 0; margin-bottom: 24px; }
    textarea { width: 100%; height: 200px; padding: 14px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 8px; resize: vertical; outline: none; }
    textarea:focus { border-color: #2563eb; }
    .button-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
    button { flex: 1; min-width: 140px; padding: 12px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    .stats { display: flex; gap: 20px; font-size: 14px; font-weight: 600; color: #475569; background: #e2e8f0; padding: 12px 16px; border-radius: 6px; }
    .ad-space { margin-top: 30px; padding: 20px; background: #f1f5f9; border: 1px dashed #cbd5e1; text-align: center; color: #94a3b8; border-radius: 8px; }
  </style>
</head>
<body>

  <h1>Clean Text & Case Converter</h1>
  <p class="subtitle">Paste your text below to quickly fix capital letters or remove extra spaces.</p>

  <textarea id="userInput" placeholder="Paste or type your text here..."></textarea>

  <div class="stats">
    <span id="charCount">Characters: 0</span>
    <span id="wordCount">Words: 0</span>
  </div>

  <div class="button-group">
    <button onclick="toUpper()">UPPERCASE</button>
    <button onclick="toLower()">lowercase</button>
    <button onclick="toTitle()">Title Case</button>
    <button onclick="cleanSpaces()">Clean Spaces</button>
    <button class="secondary" onclick="copyText()">Copy Text</button>
  </div>

  <div class="ad-space">
    Advertisement Space (Google AdSense goes here later)
  </div>

  <script>
    const textarea = document.getElementById('userInput');
    const charCount = document.getElementById('charCount');
    const wordCount = document.getElementById('wordCount');

    textarea.addEventListener('input', () => {
      const text = textarea.value;
      charCount.innerText = `Characters: ${text.length}`;
      const words = text.trim().split(/\s+/).filter(word => word.length > 0);
      wordCount.innerText = `Words: ${words.length}`;
    });

    function toUpper() { textarea.value = textarea.value.toUpperCase(); }
    function toLower() { textarea.value = textarea.value.toLowerCase(); }
    function toTitle() {
      textarea.value = textarea.value.toLowerCase().replace(/(?:^|\s)\w/g, match => match.toUpperCase());
    }
    function cleanSpaces() {
      textarea.value = textarea.value.replace(/\s+/g, ' ').trim();
      textarea.dispatchEvent(new Event('input'));
    }
    function copyText() {
      textarea.select();
      navigator.clipboard.writeText(textarea.value);
      alert("Text copied to clipboard!");
    }
  </script>

</body>
</html>
